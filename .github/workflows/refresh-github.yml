# Once a day: pull the contribution graph, pinned repos and their READMEs, and push them if anything changed.
# The push is what redeploys the site on Vercel.
name: Refresh GitHub data

on:
  schedule:
    - cron: "0 8 * * *" # every day, 08:00 UTC (early morning in Halifax)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch
        run: scripts/fetch-github.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push
        run: |
          git add public/data
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh GitHub data"
          git push
